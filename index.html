<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlon Monsalve — Portafolio</title>
    <meta name="description" content="Portafolio de Marlon Monsalve, desarrollador full-stack junior. Haz clic en la pantalla para entrar.">
    <link rel="stylesheet" href="landing.css">
    <script src="https://kit.fontawesome.com/0b4fbe2e64.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="room">
    <div class="stars" aria-hidden="true"></div>
    <div class="room-glow" aria-hidden="true"></div>

    <header class="intro">
        <h1>Marlon Monsalve</h1>
        <p>Desarrollador Full-Stack — dale clic a la pantalla para entrar a mi universo</p>
    </header>

    <div class="scene">

        <div class="tv-unit">
            <div class="tv">
                <div class="tv-bezel">
                    <div class="tv-screen">
                        <iframe
                            src="sistema-solar.html?preview"
                            title="Vista previa del portafolio"
                            tabindex="-1"
                            aria-hidden="true"
                            loading="lazy"></iframe>
                        <a class="tv-screen-link" href="sistema-solar.html" aria-label="Entrar al portafolio interactivo de Marlon Monsalve">
                            <span class="enter-hint">
                                <i class="fa-solid fa-play"></i>
                                Haz clic para entrar
                            </span>
                        </a>
                    </div>
                </div>
                <div class="tv-cam"></div>
            </div>
            <div class="tv-stand"></div>
            <div class="tv-shadow" aria-hidden="true"></div>
        </div>

        <div class="gamer" aria-hidden="true">
            <div class="beanbag"></div>

            <svg class="character" viewBox="0 0 240 230" xmlns="http://www.w3.org/2000/svg">
                <ellipse class="char-shadow" cx="140" cy="220" rx="102" ry="10"/>

                <rect class="console-box" x="6" y="184" width="46" height="28" rx="6"/>
                <rect class="console-slot" x="14" y="192" width="30" height="4" rx="2"/>
                <circle class="console-light" cx="44" cy="204" r="2.5"/>
                <path class="cable" d="M44,192 C58,182 48,168 60,158 C72,148 64,168 78,178 C88,185 94,190 98,194"/>

                <ellipse class="char-leg char-leg-left" cx="100" cy="208" rx="20" ry="15"/>
                <ellipse class="char-leg char-leg-right" cx="180" cy="208" rx="20" ry="15"/>

                <path class="char-body" d="M92,220 C80,176 84,128 110,104 C128,87 152,87 170,104 C196,128 200,176 188,220 Z"/>

                <path class="char-arm char-arm-left" d="M94,138 C72,148 60,166 62,186 C63,194 70,198 77,194 C87,188 94,173 98,156 Z"/>
                <path class="char-arm char-arm-right" d="M186,138 C208,148 220,166 218,186 C217,194 210,198 203,194 C193,188 186,173 182,156 Z"/>

                <ellipse class="char-ear char-ear-left" cx="103" cy="66" rx="5" ry="8"/>
                <ellipse class="char-ear char-ear-right" cx="177" cy="66" rx="5" ry="8"/>
                <rect class="char-neck" x="128" y="88" width="24" height="20" rx="6"/>
                <circle class="char-head" cx="140" cy="58" r="38"/>

                <g class="char-controller">
                    <rect x="100" y="182" width="80" height="34" rx="16"/>
                    <circle class="controller-stick" cx="120" cy="199" r="8"/>
                    <circle class="controller-stick" cx="160" cy="199" r="8"/>
                    <circle class="controller-btn" cx="170" cy="188" r="3"/>
                    <circle class="controller-btn" cx="178" cy="196" r="3"/>
                </g>
            </svg>
        </div>

    </div>

    <p class="scroll-hint"><i class="fa-solid fa-arrow-pointer"></i> Clic en la pantalla</p>
</div>

<script src="landing.js"></script>

</body>
</html>
