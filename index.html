<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlon Monsalve — Desarrollador Full-Stack</title>
    <meta name="description" content="Portafolio de Marlon Monsalve, desarrollador full-stack junior. Proyectos, experiencia, estudios y contacto en un universo interactivo.">
    <meta name="theme-color" content="#05070f">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="landing.css">
    <script src="https://kit.fontawesome.com/0b4fbe2e64.js" crossorigin="anonymous"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>

<!-- Fondo de estrellas fuera del marco -->
<canvas id="bg-stars" aria-hidden="true"></canvas>

<main class="frame" id="frame">

    <!-- Capas de fondo del marco -->
    <div class="nebula" aria-hidden="true">
        <span class="neb neb-1"></span>
        <span class="neb neb-2"></span>
        <span class="neb neb-3"></span>
    </div>
    <canvas id="planet" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>


    <!-- Barra de navegación -->
    <header class="nav">
        <a class="logo" href="#" data-goto="0" aria-label="Inicio — Marlon Monsalve">
            <span class="logo-badge">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <defs>
                        <radialGradient id="lg" cx="35%" cy="30%" r="75%">
                            <stop offset="0" stop-color="#3b82f6"/>
                            <stop offset="1" stop-color="#0b1f5c"/>
                        </radialGradient>
                    </defs>
                    <circle cx="32" cy="32" r="26" fill="url(#lg)"/>
                    <circle cx="19" cy="20" r="1" fill="#fff"/>
                    <circle cx="44" cy="44" r="1.2" fill="#fff"/>
                    <circle cx="40" cy="17" r=".8" fill="#fff"/>
                    <path d="M4 40 C 22 34, 40 22, 62 14 C 46 26, 26 38, 4 40Z" fill="#ef4444"/>
                    <text x="32" y="38" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="900" font-size="17" fill="#fff">MM</text>
                </svg>
            </span>
        </a>

        <nav class="nav-links" id="nav-links" aria-label="Secciones">
            <button type="button" data-goto="0">Sobre mí</button>
            <button type="button" data-goto="1">Proyectos</button>
            <button type="button" data-goto="2">Experiencia</button>
            <button type="button" data-goto="3">Estudios</button>
            <button type="button" data-goto="4">Contacto</button>
            <a href="sistema-solar.html" data-warp>Universo 3D</a>
        </nav>

        <div class="nav-actions">
            <a class="pill" href="sistema-solar.html" data-warp>
                <span>Entrar al universo</span>
                <i class="fa-solid fa-rocket"></i>
            </a>
            <div class="socials" id="nav-socials"></div>
            <button class="icon-btn" id="share-btn" type="button" aria-label="Compartir portafolio">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button class="icon-btn burger" id="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-links">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- Pestaña lateral izquierda -->
    <a class="side-tab" href="sistema-solar.html" data-warp>
        <span>Universo 3D</span>
    </a>

    <!-- Contenido de la diapositiva -->
    <section class="hero-copy" id="hero-copy" aria-live="polite">
        <p class="counter"><span id="counter-current">01</span>/<span id="counter-total">05</span></p>
        <p class="kicker" id="kicker"></p>
        <h1 class="title" id="title"></h1>
        <p class="lead" id="lead"></p>
        <div class="chips" id="chips"></div>
        <div class="cta-row">
            <a class="cta" id="cta" href="sistema-solar.html" data-warp>
                <span id="cta-label">Explorar</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <span class="planet-tag" id="planet-tag"></span>
        </div>
    </section>

    <!-- Indicador vertical de progreso -->
    <nav class="progress" id="progress" aria-label="Diapositivas"></nav>

    <p class="scroll-hint" aria-hidden="true">
        <i class="fa-solid fa-computer-mouse"></i> Desplázate
    </p>
</main>

<!-- Pie de página legal (Ley 1581 de 2012 y Ley 1480 de 2011) -->

    <p>
        <span data-field="fullName">Marlon Stiven Monsalve Pulido</span> ·

        <a data-field="email" href="mailto:stimonl06@gmail.com">stimonl06@gmail.com</a> ·
        <span data-field="phone">+57 312 443 2044</span>
    </p>
    <p>
        <a href="politica-de-datos.html">Política de tratamiento de datos</a> ·

        © <span data-field="year">2026</span> <span data-field="fullName">Marlon Stiven Monsalve Pulido</span>
    </p>
</footer>

<canvas id="warp" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script type="module" src="landing.js"></script>

</body>
</html>
