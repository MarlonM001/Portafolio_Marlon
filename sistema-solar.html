<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo — Marlon Monsalve, Desarrollador Full-Stack</title>
    <meta name="description" content="Viaja en cohete por el universo de Marlon Monsalve: sobre mí, experiencia, estudios, habilidades, proyectos y contacto.">
    <meta name="theme-color" content="#04050c">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="universo.css">
    <script src="https://kit.fontawesome.com/0b4fbe2e64.js" crossorigin="anonymous"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<!-- Pantalla de carga -->
<div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-ring"><span></span></div>
    <p class="loader-title">Preparando el despegue</p>
    <p class="loader-pct"><span id="loader-pct">0</span>%</p>
</div>

<!-- Escena 3D (fija detrás del contenido) -->
<canvas id="universe" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>

<!-- Barra superior -->
<header class="topbar">
    <a class="logo" href="index.html" aria-label="Volver a la portada">
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
                <radialGradient id="lg" cx="35%" cy="30%" r="75%">
                    <stop offset="0" stop-color="#3b82f6"/>
                    <stop offset="1" stop-color="#0b1f5c"/>
                </radialGradient>
            </defs>
            <circle cx="32" cy="32" r="26" fill="url(#lg)"/>
            <path d="M4 40 C 22 34, 40 22, 62 14 C 46 26, 26 38, 4 40Z" fill="#ef4444"/>
            <text x="32" y="38" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="900" font-size="17" fill="#fff">MM</text>
        </svg>
    </a>
    <nav class="topnav" id="topnav" aria-label="Secciones del universo"></nav>
    <div class="top-actions">
        <a class="pill" href="index.html"><i class="fa-solid fa-arrow-left"></i><span>Portada</span></a>
        <button class="icon-btn burger" id="burger" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="topnav">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>

<!-- Riel lateral (HUD) -->
<aside class="hud" aria-hidden="true">
    <div class="hud-dots" id="hud-dots"></div>
    <div class="hud-readout">
        <p>ALT <b id="hud-alt">0</b> km</p>
        <p>VEL <b id="hud-vel">0.0</b> km/s</p>
        <p>SEC <b id="hud-sec">INICIO</b></p>
    </div>
</aside>

<!-- Redes a la izquierda -->
<aside class="social-rail" id="social-rail"></aside>

<!-- Paneles de contenido (se generan desde data.js) -->
<main id="overlays" class="overlays"></main>

<!-- Pista inferior -->
<div class="scroll-cue" id="scroll-cue">
    <span>Desplázate para despegar</span>
    <i class="fa-solid fa-chevron-down"></i>
</div>

<!-- Modal de proyecto -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card">
        <button class="modal-close" type="button" data-close aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
        <div id="modal-body"></div>
    </article>
</div>

<!-- Espaciador: la altura del scroll controla el viaje -->
<div id="track" class="track" aria-hidden="true"></div>

<script src="data.js"></script>
<script type="module" src="universo.js"></script>

</body>
</html>
